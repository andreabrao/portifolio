<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base — CRUD de Produtos</title>
  <style>
    :root{--ink:#10231c;--paper:#f5f3eb;--white:#fffefa;--lime:#dfff4f;--blue:#7dbbff;--line:#c7cec8;--muted:#6b7871;--red:#bd402b}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}button,input{font:inherit}.shell{max-width:1180px;margin:auto;padding:38px 28px 70px}
    header{display:flex;justify-content:space-between;align-items:center;padding-bottom:27px;border-bottom:1px solid var(--ink)}.brand{display:flex;align-items:center;gap:11px}.brand b{width:39px;height:39px;border-radius:9px;background:var(--ink);color:var(--lime);display:grid;place-items:center;font:800 13px monospace}.brand strong{font-size:18px}.status{font:700 10px monospace;border:1px solid var(--line);background:var(--white);padding:8px 11px;border-radius:20px}.status:before{content:"";display:inline-block;width:7px;height:7px;background:#3ab969;border-radius:50%;margin-right:7px}
    .title{display:flex;justify-content:space-between;align-items:flex-end;margin:45px 0 25px}.eyebrow{font:700 10px monospace;letter-spacing:1.3px;color:var(--muted)}h1{font-size:48px;letter-spacing:-2.8px;margin:7px 0 0}.title p{max-width:390px;color:var(--muted);line-height:1.5;margin:0}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.search{position:relative;width:min(370px,60%)}.search span{position:absolute;left:13px;top:10px;font-size:19px}.search input{width:100%;border:1px solid var(--line);border-radius:7px;padding:13px 14px 13px 41px;background:var(--white)}.count{font:700 10px monospace;color:var(--muted)}
    .table-card{border:1px solid var(--line);border-radius:10px;background:var(--white);overflow:hidden}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:780px}th{text-align:left;background:#e9ece6;padding:13px 16px;font:700 9px monospace;letter-spacing:1px;color:var(--muted)}td{border-top:1px solid #e1e5e0;padding:14px 16px;font-size:13px}td:first-child{display:flex;align-items:center;gap:11px}.avatar{width:33px;height:33px;border-radius:7px;background:var(--blue);display:grid;place-items:center;font:800 9px monospace}.stock{background:#e2f6e7;color:#287844;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:750}.action{border:0;background:transparent;text-decoration:underline;font-size:11px;font-weight:700;cursor:pointer;margin-right:9px}.delete{color:var(--red)}.empty{text-align:center;padding:55px;color:var(--muted)}
    .form-card{margin-top:17px;border:1px solid var(--ink);background:var(--lime);border-radius:10px;padding:20px;display:grid;grid-template-columns:1.1fr 1.6fr .9fr .7fr auto;gap:10px;align-items:center}.form-title{display:grid;gap:4px}.form-title strong{font-size:15px}.form-card input{min-width:0;border:1px solid #9da99f;background:var(--white);border-radius:6px;padding:12px}.form-card button{border:0;background:var(--ink);color:white;border-radius:6px;padding:13px 18px;font-weight:800;cursor:pointer}.cancel{background:transparent!important;color:var(--ink)!important;border:1px solid var(--ink)!important;display:none}.notice{position:fixed;right:24px;bottom:24px;background:var(--ink);color:white;border-radius:8px;padding:14px 17px;font-size:12px;transform:translateY(100px);opacity:0;transition:.25s}.notice.show{transform:none;opacity:1}
    @media(max-width:850px){.form-card{grid-template-columns:1fr 1fr}.form-title{grid-column:1/-1}.form-card #name{grid-column:1/-1}.title{display:block}.title p{margin-top:15px}}
    @media(max-width:520px){.shell{padding:25px 14px 60px}.status{display:none}.title{margin-top:35px}.title h1{font-size:38px}.search{width:72%}.form-card{grid-template-columns:1fr 1fr}.form-card input{grid-column:1/-1}.form-card button{grid-column:2}.cancel{grid-column:1!important;grid-row:5}.notice{left:14px;right:14px;text-align:center}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand"><b>DB/</b><strong>base produtos</strong></div><span class="status">DADOS SALVOS LOCALMENTE</span></header>
    <section class="title"><div><span class="eyebrow">BANCO DE DADOS + CRUD • EXEMPLO 03</span><h1>Catálogo de produtos</h1></div><p>Cadastre, consulte, edite e exclua registros. Os dados permanecem salvos neste navegador.</p></section>
    <div class="toolbar"><label class="search"><span>⌕</span><input id="search" placeholder="Buscar produto..." aria-label="Buscar produto"></label><span class="count" id="count"></span></div>
    <section class="table-card"><div class="table-scroll"><table><thead><tr><th>PRODUTO</th><th>CATEGORIA</th><th>PREÇO</th><th>ESTOQUE</th><th>AÇÕES</th></tr></thead><tbody id="rows"></tbody></table></div><div class="empty" id="empty" hidden>Nenhum produto encontrado.</div></section>
    <form class="form-card" id="productForm"><div class="form-title"><span class="eyebrow" id="formLabel">NOVO REGISTRO</span><strong id="formTitle">Adicionar ao catálogo</strong></div><input id="name" placeholder="Nome do produto" required><input id="category" placeholder="Categoria" required><input id="price" type="number" min="1" step="0.01" placeholder="Preço" required><button class="cancel" id="cancel" type="button">Cancelar</button><button type="submit" id="submit">Adicionar +</button></form>
  </main>
  <div class="notice" id="notice" role="status"></div>
  <script>
    const seed=[{id:1,name:'Caderno Aurora',category:'Papelaria',price:48,stock:23},{id:2,name:'Caneca Horizonte',category:'Casa',price:64,stock:11},{id:3,name:'Ecobag Brisa',category:'Acessórios',price:39,stock:31}];
    let products=JSON.parse(localStorage.getItem('portfolio-crud-products')||'null')||seed,editing=null;
    const rows=document.querySelector('#rows'),search=document.querySelector('#search'),form=document.querySelector('#productForm'),nameInput=document.querySelector('#name'),categoryInput=document.querySelector('#category'),priceInput=document.querySelector('#price');
    function persist(){localStorage.setItem('portfolio-crud-products',JSON.stringify(products))}
    function money(value){return value.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
    function render(){const term=search.value.toLowerCase(),visible=products.filter(item=>item.name.toLowerCase().includes(term)||item.category.toLowerCase().includes(term));rows.innerHTML=visible.map(item=>`<tr><td><span class="avatar">${item.name.slice(0,2).toUpperCase()}</span><strong>${item.name}</strong></td><td>${item.category}</td><td>${money(item.price)}</td><td><span class="stock">${item.stock} un.</span></td><td><button class="action" data-edit="${item.id}">Editar</button><button class="action delete" data-delete="${item.id}">Excluir</button></td></tr>`).join('');document.querySelector('#empty').hidden=visible.length>0;document.querySelector('#count').textContent=`${products.length} REGISTROS`}
    function notify(message){const notice=document.querySelector('#notice');notice.textContent=message;notice.classList.add('show');setTimeout(()=>notice.classList.remove('show'),1800)}
    function reset(){editing=null;form.reset();document.querySelector('#formLabel').textContent='NOVO REGISTRO';document.querySelector('#formTitle').textContent='Adicionar ao catálogo';document.querySelector('#submit').textContent='Adicionar +';document.querySelector('#cancel').style.display='none'}
    form.addEventListener('submit',event=>{event.preventDefault();const values={name:nameInput.value.trim(),category:categoryInput.value.trim(),price:Number(priceInput.value)};if(editing){products=products.map(item=>item.id===editing?{...item,...values}:item);notify('Produto atualizado com sucesso.')}else{products.push({id:Date.now(),...values,stock:10});notify('Produto adicionado com sucesso.')}persist();reset();render()});
    rows.addEventListener('click',event=>{const editId=Number(event.target.dataset.edit),deleteId=Number(event.target.dataset.delete);if(editId){const item=products.find(product=>product.id===editId);editing=editId;nameInput.value=item.name;categoryInput.value=item.category;priceInput.value=item.price;document.querySelector('#formLabel').textContent='EDITAR REGISTRO';document.querySelector('#formTitle').textContent='Atualizar produto';document.querySelector('#submit').textContent='Salvar';document.querySelector('#cancel').style.display='block';form.scrollIntoView({behavior:'smooth'})}if(deleteId&&confirm('Excluir este produto?')){products=products.filter(item=>item.id!==deleteId);persist();render();notify('Produto excluído.')}});
    document.querySelector('#cancel').addEventListener('click',reset);search.addEventListener('input',render);render();
  </script>
</body>
</html>
